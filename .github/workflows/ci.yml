name: Sandbox checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate feedback forms and architecture-only scope
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, subprocess
          root = pathlib.Path('.')
          for path in sorted(root.glob('.github/ISSUE_TEMPLATE/*.yml')):
              form = json.loads(path.read_text())
              if path.name == 'config.yml':
                  assert form['blank_issues_enabled'] is False
                  assert form['contact_links']
                  continue
              assert all(form.get(key) for key in ('name', 'description', 'body'))
              ids = []
              for field in form['body']:
                  assert field['type'] in ('markdown', 'input', 'textarea', 'dropdown', 'checkboxes')
                  assert isinstance(field['attributes'], dict)
                  if field['type'] != 'markdown':
                      ids.append(field['id'])
                      assert field['attributes']['label']
                  if field['type'] == 'dropdown':
                      assert field['attributes']['options']
              assert len(ids) == len(set(ids))
              print('Validated', path)
          if not root.joinpath('package.json').exists():
              allowed = {'.github/workflows/ci.yml', 'docs/architecture.md', 'docs/feedback.md'}
              allowed.update(str(p) for p in root.glob('.github/ISSUE_TEMPLATE/*.yml'))
              tracked = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
              assert tracked <= allowed, 'Unexpected files without product tests: ' + str(tracked - allowed)
              print('Architecture/feedback-only tree; no product to execute')
          PYTHON
      - name: Build pinned isolated host
        if: ${{ hashFiles('package.json') != '' }}
        run: docker build -t dgr-sandbox-test .
      - name: Unit and real SQLite tests
        if: ${{ hashFiles('package.json') != '' }}
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges dgr-sandbox-test npm test
      - name: Independent negative controls
        if: ${{ hashFiles('package.json') != '' }}
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges dgr-sandbox-test npm run test:mutations
      - name: Package content check
        if: ${{ hashFiles('package.json') != '' }}
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges dgr-sandbox-test npm run package:check
      - name: Installed OpenClaw dispatch
        if: ${{ hashFiles('package.json') != '' }}
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges dgr-sandbox-test
