name: Analyzer evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  eslint:
    name: ESLint evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Bind evidence to source
        run: python3 .github/analyzers/evidence.py capture reports/eslint
      - name: Install locked analyzer dependencies
        run: npm ci --prefix .github/analyzers --ignore-scripts --no-audit --no-fund
      - name: Record versions and configuration
        run: |
          node --version > reports/eslint/versions.txt
          .github/analyzers/node_modules/.bin/eslint --version >> reports/eslint/versions.txt
          cp .github/analyzers/{eslint.config.mjs,package.json,package-lock.json} reports/eslint/
      - name: Check report failure handling
        run: python3 .github/analyzers/test_evidence.py
      - name: Analyze all tracked JavaScript
        run: |
          .github/analyzers/node_modules/.bin/eslint --config .github/analyzers/eslint.config.mjs src test scripts --max-warnings 0 --format json --output-file reports/eslint/results.json
          python3 .github/analyzers/evidence.py eslint reports/eslint/results.json
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eslint-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/eslint/
          if-no-files-found: error
          retention-days: 90

  semgrep:
    name: Semgrep evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bind evidence to source
        run: python3 .github/analyzers/evidence.py capture reports/semgrep
      - name: Install pinned Semgrep CE
        run: python -m pip install semgrep==1.173.0
      - name: Fetch pinned public rule source
        run: |
          git init "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" remote add origin https://github.com/semgrep/semgrep-rules.git
          git -C "$RUNNER_TEMP/semgrep-rules" fetch --depth 1 origin a84ff9cc2453ca91d581380de4b8b3f272f6f4be
          git -C "$RUNNER_TEMP/semgrep-rules" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/semgrep-rules" rev-parse HEAD)" = a84ff9cc2453ca91d581380de4b8b3f272f6f4be
          git -C "$RUNNER_TEMP/semgrep-rules" rev-parse HEAD > reports/semgrep/rules-commit.txt
          tar -czf reports/semgrep/rules.tar.gz -C "$RUNNER_TEMP/semgrep-rules" javascript/lang/security javascript/lang/correctness javascript/audit
          cp .semgrepignore reports/semgrep/ignore.txt
          semgrep --version > reports/semgrep/version.txt
          python -m pip freeze > reports/semgrep/python-dependencies.txt
      - name: Scan source, tests and scripts
        run: |
          semgrep scan --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security" --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/correctness" --config "$RUNNER_TEMP/semgrep-rules/javascript/audit" --include '*.js' --include '*.mjs' --include '*.ts' --metrics off --disable-version-check --no-rewrite-rule-ids --strict --error --json --output reports/semgrep/results.json src test scripts 2> reports/semgrep/scan.log
          python3 .github/analyzers/evidence.py semgrep reports/semgrep/results.json
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/semgrep/
          if-no-files-found: error
          retention-days: 90

  codeql:
    name: CodeQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bind evidence to source
        run: |
          python3 .github/analyzers/evidence.py capture reports/codeql
          cp .github/analyzers/codeql.yml reports/codeql/config.yml
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/analyzers/codeql.yml
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.gz
      - name: Analyze and upload code-scanning results
        uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          output: reports/codeql/sarif
          category: dgr-javascript
      - name: Reject findings or incomplete reports
        run: python3 .github/analyzers/evidence.py codeql reports/codeql/sarif/javascript.sarif
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/codeql/
          if-no-files-found: error
          retention-days: 90
